<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2A885F">
  <title>ゴルフシフト管理</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-sub: #64748b;
      --danger: #ef4444;
      --danger-bg: #fee2e2;
      --warning: #f59e0b;
      --warning-bg: #fef3c7;
      --success: #10b981;
      --success-bg: #d1fae5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    h1 {
      font-size: 18px;
      font-weight: 700;
    }

    .sub-info {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 週ナビゲーション */
    .week-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .current-month-title {
      font-weight: bold;
      font-size: 14px;
    }

    /* 日付タブナビゲーション */
    .day-tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab-item {
      flex: 1;
      min-width: 58px;
      padding: 10px 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
      position: relative;
    }

    .tab-item.active {
      color: var(--primary);
      font-weight: bold;
      background: #eff6ff;
    }

    .tab-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 10%;
      width: 80%;
      height: 3px;
      background: var(--primary);
      border-radius: 3px 3px 0 0;
    }

    .tab-date {
      font-size: 15px;
      font-weight: bold;
      display: block;
      margin-top: 2px;
    }

    .badge {
      display: block;
      font-size: 10px;
      margin-top: 2px;
    }

    .container {
      padding: 16px;
    }

    .status-card {
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .status-card.danger { background-color: var(--danger-bg); color: #991b1b; }
    .status-card.success { background-color: var(--success-bg); color: #065f46; }
    .status-card.warning { background-color: var(--warning-bg); color: #92400e; }

    .status-title {
      font-weight: bold;
    }

    .status-desc {
      font-size: 11px;
      margin-top: 2px;
      opacity: 0.9;
    }

    /* メンバーリスト */
    .member-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .member-card {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .member-info {
      display: flex;
      flex-direction: column;
    }

    .member-name {
      font-size: 14px;
      font-weight: 500;
    }

    .member-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .btn-action {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-sub);
      cursor: pointer;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .btn-main {
      flex: 1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .btn-main:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
    }

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>ゴルフシフト</h1>
    <div class="sub-info">曜日ごとに1人5回まで振替可能</div>
  </div>
  <button class="btn-action" onclick="openMasterConfig()">固定パターン設定</button>
</header>

<!-- 週切り替えナビ -->
<div class="week-nav">
  <button class="nav-btn" onclick="changeWeek(-1)">＜ 前の週</button>
  <div class="current-month-title" id="week-title">----年--月</div>
  <button class="nav-btn" onclick="changeWeek(1)">次の週 ＞</button>
</div>

<!-- 日付タブ (月〜土) -->
<div class="day-tabs" id="day-tabs"></div>

<div class="container">
  <div id="status-container"></div>
  <div class="member-list" id="member-list"></div>
</div>

<div class="bottom-bar">
  <button class="btn-main" id="add-btn" onclick="addFreeShift()">+ 自由シフトを追加</button>
</div>

<!-- 固定パターン設定モーダル -->
<div class="modal" id="master-modal">
  <div class="modal-content">
    <div class="modal-title">曜日ごとの固定メンバー設定</div>
    <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;">※カンマ(,)区切りで名前を入力してください</p>
    <div id="master-inputs"></div>
    <div class="modal-actions">
      <button class="btn-action" onclick="closeMasterConfig()">キャンセル</button>
      <button class="btn-main" style="padding: 8px 16px;" onclick="saveMasterConfig()">保存</button>
    </div>
  </div>
</div>

<script>
  const MIN_STAFF = 6;
  const MAX_STAFF = 14;
  const MAX_RESCHEDULE_PER_DAY = 5; // 1人・1曜日あたり最大5回

  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  const defaultMaster = {
    '月': ['石川', '大川', '岡', '笠原', '橋本', '三上', '江戸川', '海沼', '児玉', '三浦', '森'],
    '火': ['庄野', '斎藤', '中崎', '京戸', '鎌田', '江戸川', '北出', '下川', '韓', '溝端', '森'], 
    '水': ['小秋元', '髙橋', '保脇', '鈴木', '大西（心）', '松村', '下川', '中溝', '松橋', '松本', '吉澤'],
    '木': ['窪島', '戸ノ下', '三野', '永田', '海沼', '北出', '中村', '古川', '松村', '吉澤'],
    '金': ['小池', '山下', '工藤', '児玉', '中村', '韓', '松橋', '松本', '三浦', '溝端', '宮島'],
    '土': ['梅津', '安部', '菊地', '伊東', '大山', '大西（心）', '中溝', '古川', '宮島']
  };

  let masterConfig = JSON.parse(localStorage.getItem('masterConfig')) || defaultMaster;
  let customShifts = JSON.parse(localStorage.getItem('customShifts')) || {}; 
  
  // 曜日ごとの個人別振替消化数データ: { "月_スタッフA": 2, "火_スタッフA": 0 }
  let userDayRescheduleCounts = JSON.parse(localStorage.getItem('userDayRescheduleCounts')) || {};

  let currentMonday = getMonday(new Date());
  let selectedDateStr = formatDate(currentMonday);

  function getMonday(d) {
    const date = new Date(d);
    const day = date.getDay();
    const diff = date.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(date.setDate(diff));
  }

  function formatDate(d) {
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const date = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${date}`;
  }

  function getDayName(dateStr) {
    const d = new Date(dateStr);
    return WEEKDAYS[d.getDay()];
  }

  function getWeekDays(monday) {
    const days = [];
    for (let i = 0; i < 6; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      days.push(d);
    }
    return days;
  }

  function getShiftForDate(dateStr) {
    if (customShifts[dateStr]) {
      return customShifts[dateStr];
    }
    const dayName = getDayName(dateStr);
    return masterConfig[dayName] ? [...masterConfig[dayName]] : [];
  }

  function getRescheduleUsed(memberName, dayName) {
    const key = `${dayName}_${memberName}`;
    return userDayRescheduleCounts[key] || 0;
  }

  function addRescheduleCount(memberName, dayName) {
    const key = `${dayName}_${memberName}`;
    const current = userDayRescheduleCounts[key] || 0;
    userDayRescheduleCounts[key] = current + 1;
  }

  function saveStorage() {
    localStorage.setItem('masterConfig', JSON.stringify(masterConfig));
    localStorage.setItem('customShifts', JSON.stringify(customShifts));
    localStorage.setItem('userDayRescheduleCounts', JSON.stringify(userDayRescheduleCounts));
    render();
  }

  function renderTabs() {
    const weekDays = getWeekDays(currentMonday);
    const tabsContainer = document.getElementById('day-tabs');

    const firstDay = weekDays[0];
    document.getElementById('week-title').textContent = `${firstDay.getFullYear()}年 ${firstDay.getMonth() + 1}月`;

    tabsContainer.innerHTML = weekDays.map(d => {
      const dateStr = formatDate(d);
      const dayName = WEEKDAYS[d.getDay()];
      const members = getShiftForDate(dateStr);
      const isSelected = dateStr === selectedDateStr;

      return `
        <div class="tab-item ${isSelected ? 'active' : ''}" onclick="selectDate('${dateStr}')">
          <div>${dayName}</div>
          <span class="tab-date">${d.getDate()}</span>
          <span class="badge">${members.length}人</span>
        </div>
      `;
    }).join('');
  }

  function renderContent() {
    const members = getShiftForDate(selectedDateStr);
    const count = members.length;
    const currentDayName = getDayName(selectedDateStr);

    // ステータスカード
    const statusBox = document.getElementById('status-container');
    if (count < MIN_STAFF) {
      statusBox.innerHTML = `
        <div class="status-card danger">
          <div class="status-title">⚠️ 人員不足 (${count}/${MIN_STAFF}名)</div>
          <div class="status-desc">6名を下回っているため、代理を立てる必要があります。</div>
        </div>
      `;
    } else if (count < MAX_STAFF) {
      statusBox.innerHTML = `
        <div class="status-card success">
          <div class="status-title">〇 出勤OK (${count}名)</div>
          <div class="status-desc">最大14名まで「自由シフト」として参加可能です。</div>
        </div>
      `;
    } else {
      statusBox.innerHTML = `
        <div class="status-card warning">
          <div class="status-title">満員 (14/14名)</div>
          <div class="status-desc">これ以上自由シフトを追加できません。</div>
        </div>
      `;
    }

    // メンバーリスト
    const listContainer = document.getElementById('member-list');
    listContainer.innerHTML = members.map(name => {
      const used = getRescheduleUsed(name, currentDayName);
      const remaining = MAX_RESCHEDULE_PER_DAY - used;
      
      return `
        <div class="member-card">
          <div class="member-info">
            <span class="member-name">${name}</span>
            <span class="member-sub">${currentDayName}曜枠 振替残: ${remaining} / ${MAX_RESCHEDULE_PER_DAY} 回</span>
          </div>
          <button class="btn-action" onclick="requestReschedule('${name}')">振替</button>
        </div>
      `;
    }).join('');

    document.getElementById('add-btn').disabled = count >= MAX_STAFF;
  }

  function selectDate(dateStr) {
    selectedDateStr = dateStr;
    render();
  }

  function changeWeek(direction) {
    currentMonday.setDate(currentMonday.getDate() + (direction * 7));
    const weekDays = getWeekDays(currentMonday);
    selectedDateStr = formatDate(weekDays[0]);
    render();
  }

  function addFreeShift() {
    const members = getShiftForDate(selectedDateStr);
    if (members.length >= MAX_STAFF) return;

    const name = prompt(`${selectedDateStr} に追加するお名前を入力してください:`);
    if (name && name.trim()) {
      members.push(name.trim());
      customShifts[selectedDateStr] = members;
      saveStorage();
    }
  }

  function requestReschedule(memberName) {
    const currentDayName = getDayName(selectedDateStr);
    const used = getRescheduleUsed(memberName, currentDayName);

    if (used >= MAX_RESCHEDULE_PER_DAY) {
      alert(`${memberName}さんの【${currentDayName}曜日枠】の振替上限（${MAX_RESCHEDULE_PER_DAY}回）に達しているため、振替できません。`);
      return;
    }

    const targetDateStr = prompt(`【振替申請】${memberName}さん（${currentDayName}曜枠 振替残:${MAX_RESCHEDULE_PER_DAY - used}回）\n振替先の日付を YYYY-MM-DD 形式で入力してください:\n(例: 2026-10-05)`);
    if (!targetDateStr) return;

    if (!/^\d{4}-\d{2}-\d{2}$/.test(targetDateStr)) {
      alert('日付の形式が正しくありません (例: 2026-10-05)');
      return;
    }

    const targetMembers = getShiftForDate(targetDateStr);
    if (targetMembers.length >= MAX_STAFF) {
      alert(`${targetDateStr} は最大人数の14名に達しているため振替できません。`);
      return;
    }

    // 移動処理
    const currentMembers = getShiftForDate(selectedDateStr).filter(m => m !== memberName);
    targetMembers.push(memberName);

    customShifts[selectedDateStr] = currentMembers;
    customShifts[targetDateStr] = targetMembers;

    // 該当曜日での振替カウントを追加
    addRescheduleCount(memberName, currentDayName);

    saveStorage();
    alert(`${memberName}さんを ${targetDateStr} へ振替しました。\n（${currentDayName}曜枠 振替残り: ${MAX_RESCHEDULE_PER_DAY - (used + 1)}回）`);
  }

  function openMasterConfig() {
    const inputsContainer = document.getElementById('master-inputs');
    const days = ['月', '火', '水', '木', '金', '土'];
    
    inputsContainer.innerHTML = days.map(d => `
      <div class="form-group">
        <label>${d}曜日の固定メンバー</label>
        <input type="text" id="master-${d}" value="${(masterConfig[d] || []).join(', ')}">
      </div>
    `).join('');

    document.getElementById('master-modal').style.display = 'flex';
  }

  function closeMasterConfig() {
    document.getElementById('master-modal').style.display = 'none';
  }

  function saveMasterConfig() {
    const days = ['月', '火', '水', '木', '金', '土'];
    days.forEach(d => {
      const inputVal = document.getElementById(`master-${d}`).value;
      masterConfig[d] = inputVal.split(',').map(s => s.trim()).filter(s => s.length > 0);
    });

    closeMasterConfig();
    saveStorage();
    alert('固定パターンを更新しました！');
  }

  function render() {
    renderTabs();
    renderContent();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  render();
</script>
</body>
</html>
