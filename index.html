<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#006241">
  <title>オークラ振替連絡</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --green: #006241;
      --green-deep: #00331f;
      --green-mid: #0a7a52;
      --green-tint: #e4efe8;
      --gold: #c5a059;
      --gold-deep: #9a7a36;
      --paper: #eef2ee;
      --sheet: #ffffff;
      --line: #d3dfd6;
      --ink: #10241a;
      --ink-sub: #5a7468;
      --red: #c4132f;
      --red-tint: #fde8eb;
      --amber: #8a5a00;
      --amber-tint: #fff3d6;
      --sky: #0b5c8a;
      --sky-tint: #e1f0f9;
      --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
      --sans: "Zen Kaku Gothic New", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    button, input, textarea, select { font-family: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--gold); outline-offset: 2px;
    }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      padding-bottom: calc(96px + env(safe-area-inset-bottom));
      line-height: 1.5;
    }

    /* ---------- ログイン ---------- */
    .login-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; justify-content: center; align-items: center; padding: 20px;
      background:
        radial-gradient(rgba(255,255,255,0.07) 1.3px, transparent 1.7px) 0 0 / 15px 15px,
        linear-gradient(160deg, var(--green-mid), var(--green-deep));
    }
    .login-card {
      background: var(--sheet); width: 100%; max-width: 360px;
      padding: 32px 26px 28px; border-radius: 4px 18px 4px 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      border-bottom: 5px solid var(--gold);
    }
    .login-header { text-align: center; margin-bottom: 26px; }
    .login-header h2 { font-family: var(--serif); font-size: 26px; font-weight: 700; color: var(--green); letter-spacing: 0.08em; }
    .login-header p { font-size: 12px; color: var(--ink-sub); margin-top: 6px; }
    .login-error {
      display: none; text-align: center; font-size: 12px; font-weight: 500;
      color: var(--red); background: var(--red-tint);
      padding: 9px 12px; border-radius: 8px; margin-bottom: 14px;
    }

    /* ---------- ヘッダー ---------- */
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top));
      color: #fff;
      background:
        radial-gradient(rgba(255,255,255,0.07) 1.3px, transparent 1.7px) 0 0 / 15px 15px,
        linear-gradient(135deg, var(--green-mid), var(--green-deep));
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 14px rgba(0,51,31,0.25);
    }
    h1 { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.2; }
    .sub-info { font-size: 11px; color: rgba(255,255,255,0.78); margin-top: 3px; letter-spacing: 0.04em; }

    .menu-container { position: relative; }
    .menu-toggle-btn {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 7px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.45);
    }
    .menu-toggle-btn:active { background: rgba(255,255,255,0.3); }
    .menu-badge {
      min-width: 18px; text-align: center; padding: 1px 6px; border-radius: 999px;
      font-size: 10px; font-weight: 700; color: var(--green-deep); background: var(--gold);
    }
    .dropdown-menu {
      display: none; flex-direction: column; position: absolute; top: 115%; right: 0; width: 200px; z-index: 100;
      background: var(--sheet); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--line); box-shadow: 0 12px 28px rgba(0,0,0,0.22);
    }
    .dropdown-menu.show { display: flex; }
    .dropdown-item {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      padding: 13px 16px; font-size: 13px; font-weight: 700; text-align: left; cursor: pointer;
      color: var(--ink); background: none; border: none; border-bottom: 1px solid var(--line);
    }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:active { background: var(--green-tint); }
    .dropdown-item.logout-item { color: var(--red); }
    .btn-logout-only {
      padding: 7px 14px; border-radius: 999px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: #fff;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.5);
    }

    /* ---------- 週ナビ・日付ストリップ ---------- */
    .week-nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 14px 8px; background: var(--paper);
    }
    .nav-btn {
      padding: 7px 14px; border-radius: 999px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--green);
      background: var(--sheet); border: 1px solid var(--line);
    }
    .nav-btn:active { background: var(--green-tint); }
    .current-month-title { font-family: var(--serif); font-weight: 700; font-size: 19px; letter-spacing: 0.08em; color: var(--green-deep); }
    .current-month-title::after { content: ' ▾'; font-size: 11px; color: var(--gold-deep); }
    .title-wrap { position: relative; display: inline-block; padding: 2px 8px; border-radius: 8px; }
    .title-wrap:active { background: var(--green-tint); }
    .title-wrap input {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 16px;
    }

    /* スコアカード風：6日が1枚につながる */
    .day-tabs {
      display: flex; margin: 0 14px; overflow: hidden;
      background: var(--sheet); border: 1px solid var(--line); border-radius: 12px;
    }
    .tab-item {
      flex: 1; min-width: 0; position: relative; cursor: pointer; text-align: center;
      padding: 9px 0 8px; font-size: 11px; font-weight: 500; color: var(--ink-sub);
      border-right: 1px solid var(--line);
    }
    .tab-item:last-child { border-right: none; }
    .tab-date { display: block; font-family: var(--serif); font-size: 22px; font-weight: 700; line-height: 1.15; color: var(--ink); }
    .badge { display: block; font-size: 10px; margin-top: 1px; }
    .tab-item.active { background: var(--green); color: rgba(255,255,255,0.85); }
    .tab-item.active .tab-date { color: #fff; }
    .tab-item.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--gold);
    }

    /* ---------- 本体 ---------- */
    .container { padding: 14px; }

    .status-card {
      padding: 11px 14px 11px 16px; margin-bottom: 14px; border-radius: 4px 12px 12px 4px;
      border-left: 6px solid; font-size: 13px;
    }
    .status-card.danger { background: var(--red-tint); color: var(--red); border-left-color: var(--red); }
    .status-card.success { background: var(--green-tint); color: var(--green-deep); border-left-color: var(--green); }
    .status-card.warning { background: var(--amber-tint); color: var(--amber); border-left-color: var(--gold); }
    .status-title { font-weight: 700; font-size: 14px; }
    .status-desc { font-size: 11px; margin-top: 2px; opacity: 0.9; }

    /* 1枚のシートに行を並べる */
    .member-list {
      display: flex; flex-direction: column;
      background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    }
    .member-card {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px 11px 12px; border-bottom: 1px solid var(--line);
      border-left: 4px solid var(--green);
    }
    .member-card:last-child { border-bottom: none; }
    .member-card.t-transfer { border-left-color: var(--gold); }
    .member-card.t-special_transfer { border-left-color: var(--sky); }
    .member-card.t-free { border-left-color: var(--green-mid); background: #f7fbf8; }

    .avatar {
      flex: none; width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--serif); font-size: 17px; font-weight: 700;
      color: var(--green); background: var(--green-tint); border: 1px solid var(--line);
    }
    .t-transfer .avatar { color: var(--amber); background: var(--amber-tint); }
    .t-special_transfer .avatar { color: var(--sky); background: var(--sky-tint); }

    .member-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .member-name { font-size: 15px; font-weight: 700; color: var(--ink); word-break: break-all; }
    .member-sub { font-size: 11px; color: var(--ink-sub); margin-top: 1px; }

    .tag-type { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; }
    .tag-transfer { background: var(--amber-tint); color: var(--amber); }
    .tag-free { background: var(--green-tint); color: var(--green); }
    .tag-special { background: var(--sky-tint); color: var(--sky); }

    .action-group { flex: none; display: flex; gap: 6px; }
    .btn-action {
      padding: 6px 11px; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--green);
      background: var(--sheet); border: 1px solid var(--green);
    }
    .btn-action:active { background: var(--green-tint); }
    .btn-cancel { color: var(--red); border-color: var(--red); }
    .btn-cancel:active { background: var(--red-tint); }

    /* ---------- 下部ボタン ---------- */
    .bottom-bar {
      position: fixed; left: 0; right: 0; bottom: 0; display: flex;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--paper) 62%, rgba(238,242,238,0));
    }
    .btn-main {
      flex: 1; padding: 14px; border: none; border-bottom: 3px solid var(--gold); border-radius: 12px;
      font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #fff; cursor: pointer; text-align: center;
      background: linear-gradient(180deg, var(--green-mid), var(--green));
      box-shadow: 0 6px 16px rgba(0,98,65,0.3);
    }
    .btn-main:active { transform: translateY(1px); }
    .btn-main:disabled { background: #a9b9b0; border-bottom-color: #8fa197; box-shadow: none; cursor: not-allowed; }

    /* ---------- モーダル ---------- */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 100; padding: 20px;
      justify-content: center; align-items: center;
      background: rgba(0,26,16,0.55); backdrop-filter: blur(3px);
    }
    .modal-content {
      width: 100%; max-width: 420px; max-height: 86vh; overflow-y: auto;
      background: var(--sheet); padding: 22px 20px 18px; border-radius: 4px 18px 4px 18px;
      border-top: 5px solid var(--green); box-shadow: 0 20px 44px rgba(0,0,0,0.35);
    }
    .modal-title { font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 0.05em; color: var(--green-deep); margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; color: var(--ink-sub); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 11px; font-size: 14px; color: var(--ink);
      background: #fafcfa; border: 1px solid var(--line); border-radius: 8px;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { background: #fff; border-color: var(--green); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .data-section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .btn-danger-outline {
      width: 100%; margin-top: 7px; padding: 9px 12px; border-radius: 8px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--red); background: #fff; border: 1px solid var(--red);
    }
    .btn-danger-outline:active { background: var(--red-tint); }

    .request-card { margin-bottom: 12px; padding: 12px; background: #f8faf8; border: 1px solid var(--line); border-radius: 10px; }
    .request-type-badge { display: inline-block; margin-bottom: 6px; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .req-absent { background: var(--red-tint); color: var(--red); }
    .req-special { background: var(--sky-tint); color: var(--sky); }
    .request-reason { margin: 6px 0; padding: 7px 9px; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

<!-- ログイン画面 -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <div class="login-header">
      <h2>オークラ振替連絡</h2>
      <p>ログインしてシフトシステムを開始します</p>
    </div>

    <div class="login-error" id="login-error">IDまたはパスワードが正しくありません</div>

    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="login-id">ログインID</label>
        <input type="text" id="login-id" placeholder="IDを入力" required autocomplete="username" autocapitalize="none">
      </div>
      <div class="form-group">
        <label for="login-pass">パスワード</label>
        <input type="password" id="login-pass" placeholder="パスワードを入力" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-main" style="width: 100%; margin-top: 10px;">ログイン</button>
    </form>
  </div>
</div>

<header>
  <div>
    <h1>オークラ振替連絡</h1>
    <div class="sub-info">曜日ごとに1人5回まで振替可能</div>
  </div>

  <!-- 管理者用メニュー -->
  <div class="menu-container" id="admin-menu-area" style="display:none;">
    <button class="menu-toggle-btn" onclick="toggleDropdownMenu(event)">
      <span>☰</span> メニュー
      <span class="menu-badge" id="menu-badge">0</span>
    </button>

    <div class="dropdown-menu" id="dropdown-menu">
      <button class="dropdown-item" onclick="openRequestsModal()">
        📩 申請管理
        <span class="menu-badge" id="dropdown-req-badge">0</span>
      </button>
      <button class="dropdown-item" onclick="openMasterConfig()">🔒 固定設定</button>
      <button class="dropdown-item" onclick="openDataModal()">🔒 データ管理</button>
      <button class="dropdown-item logout-item" onclick="handleLogout()">🚪 ログアウト</button>
    </div>
  </div>

  <!-- 一般ユーザー用 -->
  <div id="user-menu-area" style="display:none;">
    <button class="btn-logout-only" onclick="handleLogout()">ログアウト</button>
  </div>
</header>

<div class="week-nav">
  <button class="nav-btn" onclick="changeWeek(-1)">＜ 前の週</button>
  <div class="title-wrap">
    <div class="current-month-title" id="week-title">----年--月</div>
    <input type="date" id="jump-date" aria-label="日付を選んでその週へ移動">
  </div>
  <button class="nav-btn" onclick="changeWeek(1)">次の週 ＞</button>
</div>

<div class="day-tabs" id="day-tabs"></div>

<div class="container">
  <div id="status-container"></div>
  <div class="member-list" id="member-list"></div>
</div>

<div class="bottom-bar">
  <button class="btn-main" id="add-btn" onclick="addFreeShift()">+ 自由練習を追加</button>
</div>

<!-- 特例申請モーダル -->
<div class="modal" id="special-request-modal">
  <div class="modal-content">
    <div class="modal-title" id="special-req-title">管理者への特例申請</div>

    <div class="form-group">
      <label>申請種別</label>
      <select id="req-type" onchange="toggleReqTypeUI()">
        <option value="absent">特例欠席（Shiftから外す）</option>
        <option value="special_transfer">特別振替（回数消費なし）</option>
      </select>
    </div>

    <div class="form-group" id="group-target-date" style="display:none;">
      <label>振替希望日</label>
      <input type="date" id="req-target-date">
    </div>

    <div class="form-group">
      <label>申請理由（体調不良、公式行事など）</label>
      <textarea id="req-reason" rows="3" placeholder="理由を入力してください"></textarea>
    </div>

    <input type="hidden" id="req-member-name">
    <input type="hidden" id="req-member-index">

    <div class="modal-actions">
      <button class="btn-action" style="border-color: var(--border); color: var(--text-sub);" onclick="closeModal('special-request-modal')">キャンセル</button>
      <button class="btn-main" style="padding: 8px 16px; flex: initial;" onclick="submitSpecialRequest()">送信する</button>
    </div>
  </div>
</div>

<!-- 申請一覧モーダル -->
<div class="modal" id="requests-modal">
  <div class="modal-content">
    <div class="modal-title">届いている特例申請</div>
    <div id="requests-list"></div>
    <div class="modal-actions">
      <button class="btn-action" style="border-color: var(--border); color: var(--text-sub);" onclick="closeModal('requests-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- 固定メンバー設定モーダル -->
<div class="modal" id="master-modal">
  <div class="modal-content">
    <div class="modal-title">曜日ごとの固定メンバー設定</div>
    <p style="font-size: 11px; color: var(--text-sub); margin-bottom: 12px;">※カンマ(,)区切りで名前を入力してください</p>
    <div id="master-inputs"></div>
    <div class="modal-actions">
      <button class="btn-action" style="border-color: var(--border); color: var(--text-sub);" onclick="closeModal('master-modal')">キャンセル</button>
      <button class="btn-main" style="padding: 8px 16px; flex: initial;" onclick="saveMasterConfig()">保存</button>
    </div>
  </div>
</div>

<!-- 通常振替モーダル -->
<div class="modal" id="reschedule-modal">
  <div class="modal-content">
    <div class="modal-title" id="reschedule-modal-title">振替先の選択</div>
    <div class="form-group">
      <label>振替希望日</label>
      <input type="date" id="reschedule-date-input">
    </div>
    <input type="hidden" id="reschedule-member-name">
    <input type="hidden" id="reschedule-member-index">
    <div class="modal-actions">
      <button class="btn-action" style="border-color: var(--border); color: var(--text-sub);" onclick="closeModal('reschedule-modal')">キャンセル</button>
      <button class="btn-main" style="padding: 8px 16px; flex: initial;" onclick="executeReschedule()">振替を確定する</button>
    </div>
  </div>
</div>

<!-- データ管理モーダル -->
<div class="modal" id="data-modal">
  <div class="modal-content">
    <div class="modal-title">データ管理・バックアップ</div>

    <div class="form-group">
      <label>データバックアップ（JSON出力）</label>
      <button class="btn-action" style="width: 100%;" onclick="exportData()">バックアップファイルを保存</button>
    </div>

    <div class="form-group">
      <label>データ復元（JSON読み込み）</label>
      <input type="file" id="import-file" accept=".json" onchange="importData(event)" style="font-size: 12px;">
    </div>

    <div class="data-section">
      <label style="font-size: 12px; color: var(--text-sub); font-weight: bold;">リセット操作</label>
      <button class="btn-danger-outline" onclick="resetRescheduleCounts()">振替回数のみ初期化（新学期など）</button>
      <button class="btn-danger-outline" onclick="resetAllData()">すべてのデータを初期化</button>
    </div>

    <div class="modal-actions">
      <button class="btn-action" style="border-color: var(--border); color: var(--text-sub);" onclick="closeModal('data-modal')">閉じる</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
